name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair:
              elixir: 1.14.5-otp-24
              otp: 24.3.4
          - pair:
              elixir: 1.15.7-otp-24
              otp: 24.3.4
          - pair:
              elixir: 1.16.1-otp-24
              otp: 24.3.4
          - pair:
              elixir: 1.14.5-otp-25
              otp: 25.3.2
          - pair:
              elixir: 1.15.7-otp-25
              otp: 25.3.2
          - pair:
              elixir: 1.16.1-otp-25
              otp: 25.3.2
          - pair:
              elixir: 1.14.5-otp-26
              otp: 26.2.5
          - pair:
              elixir: 1.15.7-otp-26
              otp: 26.2.5
          - pair:
              elixir: 1.16.2-otp-26
              otp: 26.2.5
          - pair:
              elixir: 1.17.2-otp-26
              otp: 26.2.5
          - pair:
              elixir: 1.17.2-otp-27
              otp: 27.0.1
          - pair:
              elixir: 1.18.3-otp-27
              otp: 27.2.2
          - pair:
              elixir: 1.18.4-otp-28
              otp: 28.0.2
          - pair:
              elixir: 1.18.4-otp-28
              otp: 28.1
          - pair:
              elixir: 1.19.4-otp-28
              otp: 28.1
          - lint: true

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v5
        if: ${{ matrix.lint }}

      - uses: jdx/mise-action@v5
        if: ${{ !matrix.lint }}
        with:
          mise_toml: |
            [tools]
            erlang = "${{ matrix.pair.otp }}"
            elixir = "${{ matrix.pair.elixir }}"

      - name: Install hex and rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/cache@v4
        name: build and deps cache
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.lint && hashFiles('mise.toml') || format('{0}-{1}', matrix.pair.elixir, matrix.pair.otp) }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.lint && hashFiles('mise.toml') || format('{0}-{1}', matrix.pair.elixir, matrix.pair.otp) }}-

      - uses: actions/cache@v4
        name: PLT cache
        if: ${{ matrix.lint }}
        with:
          path: |
            priv/plts
          key: plt-${{ runner.os }}-mix-${{ hashFiles('mise.toml') }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-mix-${{ hashFiles('mise.toml') }}-

      - name: Run mix deps.get
        run: mix deps.get --only test

      - name: Run mix format
        if: ${{ matrix.lint }}
        run: mix format --check-formatted

      - name: Run mix deps.compile
        run: mix deps.compile

      - name: Run mix compile
        if: ${{ matrix.lint }}
        run: mix compile --warnings-as-errors

      - name: Run credo
        if: ${{ matrix.lint }}
        run: mix credo --strict

      - name: Run mix test
        run: mix test

      - name: Create PLTs
        if: ${{ matrix.lint }}
        run: mix dialyzer --plt

      - name: Run dialyzer
        if: ${{ matrix.lint }}
        run: mix dialyzer --format github --format dialyxir

      - name: Run Coveralls
        if: ${{ matrix.lint }}
        run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
